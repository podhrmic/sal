[package]
name = "sal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line tools of the SAL 3.3 suite, reimplemented in Rust"

[dependencies]
sal-syntax = { path = "../sal-syntax" }
sal-core = { path = "../sal-core" }
sal-flat = { path = "../sal-flat" }
sal-engine = { path = "../sal-engine" }

[[bin]]
name = "sal-wfc"
path = "src/bin/sal-wfc.rs"

[[bin]]
name = "sal-smc"
path = "src/bin/sal-smc.rs"

[[bin]]
name = "sal-deadlock-checker"
path = "src/bin/sal-deadlock-checker.rs"

[lib]
name = "sal_cli"
path = "src/lib.rs"

[[bin]]
name = "sal-bmc"
path = "src/bin/sal-bmc.rs"

[[bin]]
name = "sal-inf-bmc"
path = "src/bin/sal-inf-bmc.rs"

[[bin]]
name = "sal-path-finder"
path = "src/bin/sal-path-finder.rs"
